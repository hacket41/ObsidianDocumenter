[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
agent_core = { path = "../agent_core" }
llm-ollama = { path = "../llm-ollama" }
obsidian-store = { path = "../obsidian-store" }

gtk = { package = "gtk4", version = "0.7" }
glib = "0.18"

tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[[bin]]
name = "desktop"
path = "src/main.rs"
